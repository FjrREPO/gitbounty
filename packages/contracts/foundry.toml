[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.27"
optimizer = true
optimizer_runs = 200
remappings = [
    "@flarenetwork/=node_modules/@flarenetwork/",
    "forge-std/=node_modules/forge-std/src/",
    "@openzeppelin/=node_modules/@openzeppelin/",
]

[rpc_endpoints]
coston2 = "https://coston2-api.flare.network/ext/C/rpc"
